<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Hanken+Grotesk:wght@300..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#DCCFC0; --paper2:#FAF5EC; --ink:#241D15; --soft:#6E6253; --line:rgba(36,29,21,.14);
  --accent:#B0613C; --accent-soft:rgba(176,97,60,.10);
  --serif:'Fraunces',serif; --sans:'Hanken Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --t:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .8s var(--t)}
body::before{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
::selection{background:var(--accent);color:var(--paper2)}
.lab{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);transition:color .6s var(--t)}

/* ====== HOME ====== */
#home{min-height:100vh;display:flex;align-items:center;justify-content:center;transition:opacity .5s var(--t),transform .5s var(--t)}
#home.gone{opacity:0;transform:scale(.97);pointer-events:none}
.stage{position:relative;width:min(94vw,860px);aspect-ratio:1/1}
.stage>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.cover{position:absolute;background:#DCCFC0;border-radius:9px;box-shadow:0 0 12px 7px #DCCFC0;transform:translate(-50%,-50%);z-index:2}
.hot{position:absolute;transform:translate(-50%,-50%);z-index:4;background:none;border:none;cursor:pointer;padding:0}
.hot .hl{position:absolute;inset:0;border-radius:14px;background:rgba(255,255,255,0);transition:background .3s var(--t),box-shadow .3s var(--t)}
.hot:hover .hl{background:rgba(255,255,255,.18);box-shadow:0 0 0 2px rgba(255,255,255,.6),0 10px 24px -10px rgba(0,0,0,.35)}
.flab{position:absolute;transform:translate(-50%,-50%);z-index:3;font-family:var(--mono);font-size:clamp(9px,1.4vw,13px);color:var(--ink);
  white-space:nowrap;padding:3px 9px;border-radius:7px;background:rgba(250,245,236,.0);transition:transform .3s var(--t)}
.flab.light{background:rgba(250,245,236,.7);backdrop-filter:blur(2px)}
.flab.dark{background:rgba(36,29,21,.82);color:#fff}
.hot:hover + .flab{transform:translate(-50%,-50%) translateY(3px)}
.hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:5;font-family:var(--mono);font-size:11px;color:var(--soft);letter-spacing:.04em;opacity:.8}

/* ====== VIEW ====== */
#view{position:fixed;inset:0;z-index:50;background:var(--paper2);overflow-y:auto;opacity:0;transform:scale(.98) translateY(10px);pointer-events:none;transition:opacity .5s var(--t),transform .5s var(--t)}
#view.open{opacity:1;transform:none;pointer-events:auto}
.vbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper2) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.vbar-in{max-width:1080px;margin:0 auto;padding:14px 30px;display:flex;align-items:center;gap:22px}
.close{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.close:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.vtabs{position:relative;display:flex;gap:24px;margin-left:6px}
.vtab{border:none;background:none;cursor:pointer;font-family:var(--mono);font-size:12.5px;color:var(--soft);padding:4px 0;transition:color .35s var(--t)}
.vtab.on{color:var(--ink)}
.vuline{position:absolute;bottom:-1px;height:2px;background:var(--accent);transition:all .5s var(--t),background .6s var(--t)}
.vmail{margin-left:auto;font-size:12.5px;font-weight:600;text-decoration:none;color:var(--ink);border-bottom:1.5px solid var(--accent);padding-bottom:2px}
@media(max-width:680px){.vbar-in{padding:12px 18px;gap:14px}.vmail{display:none}.vtabs{gap:16px}}
.wrap{max-width:1080px;margin:0 auto;padding:0 30px}
@media(max-width:680px){.wrap{padding:0 18px}}
.hero{padding:54px 0 26px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:54px;align-items:center}
.hname{font-family:var(--serif);font-weight:330;font-size:clamp(48px,8vw,96px);line-height:.9;letter-spacing:-.03em;margin:12px 0 4px}
.hname em{font-style:italic;color:var(--accent);transition:color .6s var(--t)}
.hrole{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--soft)}
.hbio{font-size:16px;color:var(--soft);max-width:430px;margin-top:22px}
.hchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.hchip{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:100px;padding:6px 14px;background:#fff}
.hstat{margin-top:28px;display:flex;align-items:baseline;gap:14px}
.hstat .b{font-family:var(--serif);font-size:clamp(36px,6vw,56px);font-weight:400;color:var(--accent);letter-spacing:-.02em;transition:color .6s var(--t)}
.hstat .l{font-size:13px;color:var(--soft);max-width:150px;line-height:1.35}
.hphoto{position:relative;aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:linear-gradient(150deg,var(--accent),#d7a679);box-shadow:0 30px 60px -34px rgba(36,29,21,.5)}
.hphoto img{width:100%;height:100%;object-fit:cover}
.hphoto .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-family:var(--serif);font-style:italic}
.hphoto .cap{position:absolute;left:14px;bottom:14px;background:color-mix(in srgb,var(--paper2) 92%,transparent);backdrop-filter:blur(6px);font-size:12px;font-weight:600;padding:7px 13px;border-radius:100px}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr;gap:30px}.hphoto{max-width:320px}.hero{padding:36px 0 20px}}
.sec{padding:46px 0;border-top:1px solid var(--line)}
.sec-h{margin-bottom:24px}
.sec-t{font-family:var(--serif);font-weight:360;font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;line-height:1;margin-top:8px}
.sec-t em{font-style:italic;color:var(--accent);transition:color .6s var(--t)}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:6px 24px;border-left:1px solid var(--line)}
.stat:first-child{border-left:none;padding-left:0}
.stat .n{font-family:var(--serif);font-size:clamp(32px,5vw,46px);font-weight:380;letter-spacing:-.02em;line-height:1}
.stat .n em{font-style:normal;color:var(--accent);transition:color .6s var(--t)}
.stat .k{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:11px}
.stat .s{font-size:12px;color:var(--soft);margin-top:2px}
.substrip{margin-top:26px;text-align:center;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--soft)}
@media(max-width:680px){.stats{grid-template-columns:1fr 1fr;gap:22px 0}.stat{padding:0 16px}.stat:nth-child(odd){border-left:none;padding-left:0}}
.aud{display:grid;grid-template-columns:1fr 1fr .85fr;gap:44px;align-items:start}
.aud h4{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin-bottom:16px}
.brr{margin-bottom:13px}.brr .tp{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:6px}
.brr .bt{height:6px;background:var(--accent-soft);border-radius:100px;overflow:hidden}
.brr .bf{height:100%;width:0;background:var(--accent);border-radius:100px;transition:width 1s var(--t),background .6s var(--t)}
.loc{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.loc .top{height:104px;background:linear-gradient(135deg,#cfd9c4,#bcd2d6);position:relative;display:flex;align-items:center;justify-content:center}
.loc .top::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(36,29,21,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(36,29,21,.05) 1px,transparent 1px);background-size:22px 22px}
.loc .pin{position:relative;z-index:2;font-size:28px}.loc .bot{padding:13px 15px}.loc .ml{font-family:var(--serif);font-size:17px}.loc .ms{font-size:12px;color:var(--soft);margin-top:2px}
.gender{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--accent);margin-top:10px;transition:color .6s var(--t)}
@media(max-width:820px){.aud{grid-template-columns:1fr;gap:28px}}
.vids{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.vid{text-decoration:none;color:inherit;display:block}
.vthumb{position:relative;aspect-ratio:9/16;border-radius:5px;overflow:hidden;background:linear-gradient(160deg,var(--accent),#d7a679);box-shadow:0 20px 38px -24px rgba(36,29,21,.5);transition:transform .45s var(--t)}
.vid:hover .vthumb{transform:translateY(-6px)}
.vthumb img{width:100%;height:100%;object-fit:cover}
.vid.todo .vthumb{background:repeating-linear-gradient(45deg,#efe7da,#efe7da 12px,#e6ddcd 12px,#e6ddcd 24px);display:flex;align-items:center;justify-content:center}
.vid.todo .add{color:var(--soft);font-family:var(--serif);font-style:italic;font-size:14px;text-align:center;padding:14px}
.vpin{position:absolute;top:9px;left:9px;background:color-mix(in srgb,var(--paper2) 92%,transparent);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:100px}
.vplay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--paper2) 92%,transparent);display:flex;align-items:center;justify-content:center}
.vmeta{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;gap:10px}
.vmeta .vt{font-size:13.5px;font-weight:600;line-height:1.3}
.vmeta .vv{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap;transition:color .6s var(--t)}
@media(max-width:680px){.vids{grid-template-columns:1fr 1fr;gap:13px}}
.testis{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.testi{font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.5;border-top:2px solid var(--accent);padding-top:17px;transition:border-color .6s var(--t)}
.testi .who{font-family:var(--sans);font-style:normal;font-size:12.5px;font-weight:600;color:var(--soft);margin-top:11px}
@media(max-width:760px){.testis{grid-template-columns:1fr;gap:22px}}
.rate-incl{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--soft);max-width:640px;margin-bottom:20px}
.rrow{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:17px 0;border-top:1px solid var(--line)}
.rrow.feat .rn{color:var(--accent);transition:color .6s var(--t)}
.rrow .rn{font-family:var(--serif);font-size:20px;font-weight:430}
.rrow .rd{font-size:12.5px;color:var(--soft);margin-top:4px;max-width:460px}
.rrow .rp{font-family:var(--serif);font-size:25px;font-weight:430;white-space:nowrap}
.cta{padding:70px 0 30px;text-align:center}
.cta h2{font-family:var(--serif);font-weight:340;font-size:clamp(34px,6vw,62px);letter-spacing:-.025em;line-height:.98;margin-bottom:16px}
.cta h2 em{font-style:italic;color:var(--accent);transition:color .6s var(--t)}
.cta p{font-size:16px;color:var(--soft);max-width:420px;margin:0 auto 28px}
.btn{display:inline-block;background:var(--ink);color:var(--paper2);text-decoration:none;font-weight:600;font-size:15px;padding:14px 32px;border-radius:100px;transition:transform .35s var(--t),background .4s var(--t)}
.btn:hover{transform:translateY(-3px);background:var(--accent)}
.foot{padding:24px 0 50px;font-family:var(--mono);font-size:11.5px;color:var(--soft);text-align:center}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .8s var(--t),transform .8s var(--t)}
.reveal.in{opacity:1;transform:none}
</style>
</head>

  if(v.todo) return `<div class="vid todo"><div class="vthumb"><span class="add">+ ajoute le lien<br>& les vues</span></div><div class="vmeta"><span class="vt">${v.t}</span></div></div>`;
  const g=v.v.includes('abonn');
  return `<a class="vid" href="${v.url}" target="_blank" rel="noopener"><div class="vthumb">${v.img?`<img src="${v.img}">`:""}${v.pin?`<span class="vpin">${v.pin}</span>`:''}<div class="vplay"><svg width="13" height="13" viewBox="0 0 24 24" fill="#241D15"><path d="M8 5v14l11-7z"/></svg></div></div><div class="vmeta"><span class="vt">${v.t}</span><span class="vv">${g?'ð¤ '+v.v:'â¶ '+v.v}</span></div></a>`;
}

const audBlock=()=>`<section class="sec"><div class="wrap"><div class="sec-h"><div class="lab">audience</div><h2 class="sec-t">qui me <em>suit</em></h2></div><div class="aud"><div><h4>Tranche d'Ã¢ge</h4>${REAL.audAge.map(brr).join("")}</div><div><h4>Localisation</h4>${REAL.audGeo.map(brr).join("")}<div class="gender">${REAL.gender}</div></div><div class="loc"><div class="top"><span class="pin">${REAL.location.flag}</span></div><div class="bot"><div class="ml">${REAL.location.city}</div><div class="ms">${REAL.location.sub}</div></div></div></div></div></section>`;
const testiBlock=()=>`<section class="sec"><div class="wrap"><div class="sec-h"><div class="lab">social proof</div><h2 class="sec-t">ce qu'en disent <em>mes abonnÃ©es</em></h2></div><div class="testis">${REAL.testimonials.map(t=>`<div class="testi">${t.txt}<div class="who">â ${t.who}</div></div>`).join("")}</div></div></section>`;
function heroBlock(tab){return `<section class="hero"><div class="wrap"><div class="hero-grid"><div><div class="lab">media kit Â· 2026</div><h1 class="hname">${tab.name[0]} <em>${tab.name[1]}</em></h1><div class="hrole">${tab.role}</div><p class="hbio">${tab.bio}</p><div class="hchips">${tab.chips.map(c=>`<span class="hchip">${c}</span>`).join("")}</div><div class="hstat"><span class="b">${tab.hstat.b}</span><span class="l">${tab.hstat.l}</span></div></div><div class="hphoto">${tab.photo?`<img src="${tab.photo}">`:`<div class="ph">photo de Lola</div>`}<span class="cap">${tab.photoCap}</span></div></div></div></section>`;}
function videosBlock(tab){return `<section class="sec"><div class="wrap"><div class="sec-h"><div class="lab">le contenu</div><h2 class="sec-t">vidÃ©os & <em>performances</em></h2></div><div class="vids">${tab.videos.map(vidHTML).join("")}</div></div></section>`;}
function ratesBlock(){return `<section class="sec" style="border-top:none"><div class="wrap"><div class="sec-h"><div class="lab">collaborations</div><h2 class="sec-t">tarifs & <em>services</em></h2></div><p class="rate-incl">${REAL.rates.incl}</p>${REAL.rates.rows.map(r=>`<div class="rrow ${r.feat?'feat':''}"><div><div class="rn">${r.name}</div><div class="rd">${r.desc}</div></div><div class="rp">${r.price}</div></div>`).join("")}</div></section>`;}
const ctaBlock=(t)=>`<section class="cta"><div class="wrap"><h2>on <em>collabore</em> ?</h2><p>${t}</p><a class="btn" href="mailto:${REAL.contactEmail}">${REAL.contactEmail}</a></div></section><div class="foot">Lola Nomadlife Â· ${REAL.handles.ig} Â· ${REAL.handles.tt}</div>`;

function buildView(key){
  if(key==='collab') return statsBlock()+audBlock()+ratesBlock()+testiBlock()+ctaBlock("Un livre, un produit ou une marque qui mÃ©rite d'Ãªtre vu par une communautÃ© qui passe Ã  l'achat ? Parlons-en.");
  const tab=TABS[key];
  return heroBlock(tab)+statsBlock()+audBlock()+videosBlock(tab)+testiBlock()+ctaBlock("Envie de cette collab ? Ãcris-moi, je rÃ©ponds vite.");
}

/* build home overlays */
const stage=document.getElementById('stage');
HOTSPOTS.forEach(h=>{
  const cov=document.createElement('div');cov.className='cover';
  cov.style.left=h.lx+'%';cov.style.top=h.ly+'%';cov.style.width=h.lw+'%';cov.style.height=h.lh+'%';
  stage.appendChild(cov);
  const btn=document.createElement(h.ext?'a':'button');btn.className='hot';
  btn.style.left=h.x+'%';btn.style.top=h.y+'%';btn.style.width=h.w+'%';btn.style.height=h.h+'%';
  btn.innerHTML='<span class="hl"></span>';
  if(h.ext){btn.href=h.ext;btn.target='_blank';btn.rel='noopener';}else{btn.addEventListener('click',()=>open(h.go));}
  stage.appendChild(btn);
  const lab=document.createElement('div');lab.className='flab '+(h.dark?'dark':'light');
  lab.style.left=h.lx+'%';lab.style.top=h.ly+'%';lab.textContent=h.label;
  stage.appendChild(lab);
});

const home=document.getElementById('home'),view=document.getElementById('view'),vc=document.getElementById('vcontent');
const vuline=document.getElementById('vuline'),vtabs=document.querySelectorAll('.vtab');
function theme(k){const t=THEMES[k];for(const key in t)document.documentElement.style.setProperty('--'+key,t[key]);}
function moveU(){const on=document.querySelector('.vtab.on');if(on){vuline.style.left=on.offsetLeft+'px';vuline.style.width=on.offsetWidth+'px';}}
function bars(){document.querySelectorAll('#vcontent .bf').forEach(f=>{f.style.width='0';requestAnimationFrame(()=>f.style.width=f.dataset.w+'%');});}
function initReveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.15});document.querySelectorAll('#vcontent .reveal').forEach(el=>io.observe(el));}
function open(key){theme(key);vc.innerHTML=buildView(key);vtabs.forEach(b=>b.classList.toggle('on',b.dataset.go===key));home.classList.add('gone');view.classList.add('open');view.scrollTop=0;moveU();setTimeout(()=>{bars();initReveal();},120);}
function back(){view.classList.remove('open');home.classList.remove('gone');}
document.getElementById('close').addEventListener('click',back);
vtabs.forEach(b=>b.addEventListener('click',()=>open(b.dataset.go)));
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&view.classList.contains('open'))back();});
window.addEventListener('resize',moveU);
theme('book');
</script>
