<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lola Nomadlife — Media Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#bcd9ec; --bg2:#eaf2f7;
  --ink:#1d1b1a; --soft:#6b6360;
  --pink:#ff7fb0; --yellow:#fbe84e; --accent:#ff5e96;
  --note:#fff6a8; --card:#ffffff; --line:rgba(29,27,26,.12);
  --disp:'Archivo Black',sans-serif; --hand:'Caveat',cursive;
  --sans:'Hanken Grotesk',system-ui,sans-serif;
  --t:cubic-bezier(.16,1,.3,1); --tape:rgba(255,255,255,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 80% at 80% -10%,rgba(255,255,255,.6),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2) 60%);
  background-attachment:fixed;transition:background .8s var(--t);min-height:100vh;padding:22px 18px 60px;}
body::before{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.045;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
::selection{background:var(--accent);color:#fff}

.win{max-width:1080px;margin:0 auto;background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:0 40px 90px -40px rgba(20,30,50,.55),0 4px 0 rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06)}
.chrome{position:sticky;top:0;z-index:60;background:#f3f1ee;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px 16px}
.lights{display:flex;gap:7px}.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.url{background:#fff;border:1px solid var(--line);border-radius:100px;padding:6px 16px;font-size:12.5px;color:var(--soft);font-weight:600;display:flex;align-items:center;gap:7px}
.url::before{content:"🔒";font-size:10px}
.wtabs{position:relative;display:flex;gap:4px;background:#e7e4e0;border-radius:100px;padding:4px;margin-left:auto}
.wtab{position:relative;z-index:2;border:none;background:none;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:13px;padding:8px 20px;border-radius:100px;color:var(--soft);transition:color .4s var(--t)}
.wtab.on{color:#fff}
.wpill{position:absolute;z-index:1;top:4px;bottom:4px;border-radius:100px;background:var(--accent);transition:all .55s var(--t),background .6s var(--t)}
@media(max-width:680px){.url{display:none}.chrome{gap:10px}}

.viewport{overflow:hidden}
.track{display:flex;width:200%;transition:transform .65s var(--t)}
.panel{width:50%;flex:0 0 50%;padding:0 0 30px}
.pad{padding:0 30px}
@media(max-width:680px){.pad{padding:0 18px}}

.tape{position:absolute;width:74px;height:24px;background:var(--tape);border:1px solid rgba(255,255,255,.5);box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:5}
.star{position:absolute;color:var(--yellow);font-size:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12));z-index:4;pointer-events:none}
.clip{position:absolute;font-size:30px;transform:rotate(8deg);z-index:6;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}

/* HERO */
.hero{position:relative;padding:46px 30px 30px}
.bubble{position:absolute;top:30px;right:34px;background:var(--pink);color:#fff;font-weight:800;font-size:12.5px;padding:9px 15px;border-radius:16px 16px 16px 3px;transform:rotate(4deg);z-index:7;box-shadow:0 6px 14px -6px var(--pink)}
.kicker{font-family:var(--hand);font-size:26px;color:var(--accent);transform:rotate(-2deg);margin-bottom:2px}
.name{font-family:var(--disp);font-size:clamp(46px,9vw,96px);line-height:.92;letter-spacing:-.02em;position:relative;display:inline}
.name .hl{position:relative;z-index:1}
.name .hl::before{content:"";position:absolute;left:-6px;right:-6px;top:14%;bottom:12%;background:var(--yellow);transform:rotate(-1.5deg) skewX(-6deg);z-index:-1;border-radius:3px}
.script{font-family:var(--hand);font-size:clamp(34px,6vw,58px);color:var(--accent);transform:rotate(-3deg);display:block;margin-top:-4px;font-weight:700}
.handle{font-size:14px;font-weight:700;color:var(--soft);letter-spacing:.02em;margin-top:14px}
.hero-row{display:grid;grid-template-columns:1.3fr .7fr;gap:26px;align-items:start;margin-top:26px}
.note{position:relative;background:var(--note);padding:22px 22px 24px;border-radius:3px;box-shadow:0 14px 28px -14px rgba(0,0,0,.3);transform:rotate(-1.2deg);font-size:15px;line-height:1.55}
.note .nh{font-family:var(--disp);font-size:17px;margin-bottom:9px}
.note .pin{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 2px 5px rgba(0,0,0,.3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:12.5px;font-weight:700;background:#fff;border:1.5px solid var(--ink);border-radius:100px;padding:6px 13px}
.polaroid{position:relative;background:#fff;padding:11px 11px 40px;border-radius:4px;box-shadow:0 18px 34px -16px rgba(0,0,0,.4);transform:rotate(3deg);transition:transform .4s var(--t);max-width:85%;margin:0 auto}
.polaroid:hover{transform:rotate(0) scale(1.02)}
.polaroid .img{aspect-ratio:4/5;border-radius:2px;background:linear-gradient(150deg,var(--pink),var(--yellow));display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-family:var(--hand);font-size:20px;overflow:hidden}
.polaroid .img img{width:100%;height:100%;object-fit:cover;object-position:center top}
.polaroid .cap{font-family:var(--hand);font-size:17px;text-align:center;margin-top:5px;color:var(--ink)}
.polaroid .tape{top:-10px;left:50%;margin-left:-37px;transform:rotate(-4deg)}
@media(max-width:680px){.hero-row{grid-template-columns:1fr;gap:30px}.polaroid{max-width:200px;margin:0 auto}.bubble{display:none}}

.shead{display:flex;align-items:center;gap:12px;margin:42px 0 20px}
.folder{font-size:26px}
.stitle{font-family:var(--disp);font-size:clamp(22px,4vw,32px);letter-spacing:-.01em}
.stitle .u{background:var(--yellow);padding:0 6px;border-radius:3px;box-decoration-break:clone}

/* ── PHONE STRIP ───────────────────────────────── */
.phones-row{
  display:flex;
  gap:16px;
  justify-content:center;
  align-items:flex-start;
  overflow-x:auto;
  /* padding-top large pour que le hover ne soit pas clippé */
  padding:24px 8px 32px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  overflow-y:visible;
}
.phones-row::-webkit-scrollbar{display:none}

/* Un seul style iphone — utilisé pour les deux sections */
.iphone{
  flex:0 0 auto;
  width:230px;
  background:#0d0d0d;
  border-radius:48px;
  padding:5px;
  outline:1px solid rgba(0,0,0,.15);
  border:none;
  box-shadow:none;
  cursor:pointer;
  transition:transform .35s var(--t);
  position:relative;
}
.iphone:hover{
  transform:scale(1.05);
}
/* Dynamic Island */
.iphone::before{
  content:"";
  position:absolute;
  top:16px;left:50%;
  transform:translateX(-50%);
  width:52px;height:11px;
  background:#0d0d0d;
  border-radius:100px;
  z-index:10;
}
.iphone-screen{
  border-radius:44px;
  overflow:hidden;
  display:block;
  width:100%;
}
.iphone-screen img{
  width:100%;
  display:block;
}
.iphone-label{ display:none; }

/* iPhones avec label (section audience) */
.iphone-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  flex:0 0 auto;
}
.iphone-wrap .iphone{
  flex:none;
  width:230px;
}
.iphone-wrap .iphone-label{
  display:block;
  margin-top:13px;
  font-family:var(--disp);
  font-size:11px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--soft);
  text-align:center;
}

/* Titre Mon audience */
.stitle .hand{
  font-family:var(--hand);
  font-style:normal;
  font-size:1.15em;
  color:var(--accent);
  font-weight:600;
}

/* ── BIG STAT CARDS ────────────────────────────── */
.bigstats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.bstat{
  background:#fff;
  border:2px solid var(--ink);
  border-radius:16px;
  padding:18px 16px 16px;
  box-shadow:5px 5px 0 var(--ink);
  transition:transform .3s var(--t);
}
.bstat:hover{transform:translate(-2px,-2px)}
.bstat .bn{
  font-family:var(--disp);
  font-size:clamp(28px,3.5vw,40px);
  line-height:1;
  font-weight:900;
}
.bstat .bn em{font-style:normal;color:var(--accent)}
.bstat .bk{
  font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;
  margin-top:8px;color:var(--ink);
}
.bstat .bs{font-size:11px;color:var(--soft);margin-top:2px}
@media(max-width:680px){.bigstats{grid-template-columns:1fr 1fr}.bstat .bn{font-size:26px}}

/* ── PHONE + STATS SPLIT ───────────────────────── */
.numbers-split{
  display:grid;
  grid-template-columns:340px 1fr;
  gap:28px;
  align-items:center;
  margin:24px 0 8px;
}
@media(max-width:760px){.numbers-split{grid-template-columns:1fr}}

/* single featured phone */
.phone-showcase{display:flex;justify-content:center}
.phone-outer{
  background:#0d0d0d;
  border-radius:36px;
  padding:4px;
  outline:.5px solid rgba(0,0,0,.2);
  position:relative;
  cursor:pointer;
  transition:transform .4s var(--t);
}
.phone-outer:hover{transform:scale(1.025) rotate(-1deg)}
.phone-outer::before{
  content:"";position:absolute;top:13px;left:50%;
  transform:translateX(-50%);
  width:46px;height:10px;
  background:#0d0d0d;border-radius:100px;z-index:10;
}
.phone-outer img{width:200px;border-radius:33px;display:block}
.phone-badge{
  position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#fff;font-size:11px;font-weight:800;
  padding:5px 16px;border-radius:100px;white-space:nowrap;
}

/* stats list right side */
.stats-aside{display:grid;grid-template-columns:1fr;gap:9px}
.srow{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  background:#fff;
  border:1.5px solid var(--ink);
  border-radius:12px;
  box-shadow:3px 3px 0 var(--ink);
  transition:transform .3s var(--t);
}
.srow:hover{transform:translate(-2px,-2px)}
.srow .sv{
  font-family:var(--disp);font-size:18px;font-weight:900;
  color:var(--accent);white-space:nowrap;min-width:66px;
}
.srow .sl{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
.srow .sl span{display:block;font-size:11px;font-weight:500;color:var(--soft);margin-top:1px}

.substrip{margin-top:20px;background:var(--ink);color:#fff;border-radius:100px;padding:11px 20px;font-size:12.5px;font-weight:700;text-align:center;letter-spacing:.01em}
@media(max-width:680px){.substrip{font-size:11px;border-radius:18px}}

/* VIDEOS */
.vids{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.vid{position:relative;background:#fff;padding:10px 10px 34px;border-radius:4px;box-shadow:0 16px 30px -16px rgba(0,0,0,.4);text-decoration:none;color:inherit;transform:rotate(var(--r,0deg));transition:transform .4s var(--t);display:block}
.vid:hover{transform:rotate(0) translateY(-5px)}
.vid:nth-child(3n+1){--r:-1.5deg}.vid:nth-child(3n+2){--r:1.5deg}.vid:nth-child(3n){--r:-.6deg}
.vid .thumb{aspect-ratio:9/16;border-radius:2px;overflow:hidden;background:linear-gradient(160deg,var(--pink),var(--yellow));position:relative}
.vid .thumb img{width:100%;height:100%;object-fit:cover}
.vid.todo .thumb{background:repeating-linear-gradient(45deg,#f1eee9,#f1eee9 12px,#e7e3dc 12px,#e7e3dc 24px);display:flex;align-items:center;justify-content:center}
.vid.todo .thumb .add{color:var(--soft);font-family:var(--hand);font-size:18px;text-align:center;padding:14px}
.vid .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.vid .pinb{position:absolute;top:8px;left:8px;z-index:2;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:100px}
.vid .vstats{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:center;font-size:11.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.5);border-radius:100px;padding:5px 11px;backdrop-filter:blur(4px)}
.vid .cap{font-family:var(--hand);font-size:17px;text-align:center;margin-top:7px;line-height:1.1;padding:0 4px}
@media(max-width:680px){.vids{grid-template-columns:1fr 1fr;gap:10px}}

/* TESTIMONIALS */
.testis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.testi{background:#fff;border:2px solid var(--ink);border-radius:16px 16px 16px 4px;box-shadow:4px 4px 0 var(--ink);padding:17px 18px;font-size:13.5px;line-height:1.5}
.testi .who{font-family:var(--hand);font-size:18px;color:var(--accent);margin-top:9px}
@media(max-width:760px){.testis{grid-template-columns:1fr}}

/* RATES */
.ratecard{background:#fff;border:2px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--ink);padding:24px 26px;position:relative}
.ratecard .tagp{position:absolute;top:-12px;right:22px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:5px 13px;border-radius:100px;transform:rotate(3deg)}
.rate-incl{font-size:13px;color:var(--soft);border-bottom:2px dashed var(--line);padding-bottom:15px;margin-bottom:6px}
.rate-incl b{color:var(--ink);font-weight:800}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:none}
.rrow.feat{background:var(--note);margin:6px -16px 0;padding:16px;border-radius:14px;border-bottom:none}
.rrow .rl .rn{font-family:var(--disp);font-size:16px}
.rrow .rl .rd{font-size:12.5px;color:var(--soft);margin-top:3px;max-width:430px}
.rrow .rpr{font-family:var(--disp);font-size:26px;color:var(--accent);white-space:nowrap}
@media(max-width:680px){.rrow .rl .rn{font-size:14px}.rrow .rpr{font-size:22px}}

/* CONTACT */
.contact{margin-top:46px;text-align:center;position:relative;padding:30px 0 8px}
.contact .ch{font-family:var(--disp);font-size:clamp(28px,5vw,46px);line-height:1}
.contact .ch .u{background:var(--yellow);padding:0 6px;border-radius:3px}
.contact .cs{font-family:var(--hand);font-size:24px;color:var(--accent);margin:6px 0 22px}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;font-size:15px;padding:15px 34px;border-radius:100px;box-shadow:5px 5px 0 var(--accent);transition:transform .3s var(--t)}
.btn:hover{transform:translate(-2px,-2px)}

.dock{position:sticky;bottom:0;z-index:60;margin-top:8px;display:flex;justify-content:center;gap:10px;background:rgba(255,255,255,.7);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:10px}
.dock a{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.25);transition:transform .3s var(--t);text-decoration:none}
.dock a:hover{transform:translateY(-6px) scale(1.08)}

/* MODAL */
.ssmodal{display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.ssmodal.open{display:flex}
.ssmodal img{max-height:90vh;max-width:90vw;border-radius:28px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.ssmodal-close{position:absolute;top:20px;right:24px;color:rgba(255,255,255,.7);font-size:38px;cursor:pointer;background:none;border:none;line-height:1;transition:color .2s,transform .2s}
.ssmodal-close:hover{color:#fff;transform:scale(1.1)}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s var(--t),transform .8s var(--t)}
.reveal.in{opacity:1;transform:none}
</style>
</head>
<body>

<div class="ssmodal" id="ssModal" onclick="closeModal()">
  <button class="ssmodal-close" onclick="closeModal()" aria-label="Fermer">×</button>

</div>

<div class="win">

</div>

function vidHTML(v){

  return `<a class="vid" href="${v.url}" target="_blank" rel="noopener">
    <div class="thumb">${v.img?`<img src="${v.img}" alt="">`:""}
    </div><div class="cap">${v.t}</div></a>`;
}

function phonesHTML(){
  return `<div class="phones-row">

      <div class="iphone" onclick="openModal('${p.src}')" role="button" tabindex="0" aria-label="${p.alt}">

/* ── Modal ───────────────────────────────────── */
function openModal(src){
  const m=document.getElementById('ssModal');
  m.querySelector('img').src=src;
  m.classList.add('open');
}
function closeModal(){document.getElementById('ssModal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.getAttribute('role')==='button')e.target.click();});

/* ── Tabs ────────────────────────────────────── */
function theme(k){const t=THEMES[k],r=document.documentElement.style;for(const key in t)r.setProperty('--'+key,t[key]);}
const track=document.getElementById('track'),pill=document.getElementById('pill'),btns=document.querySelectorAll('.wtab'),vp=document.getElementById('viewport');
let idx=0;
function go(i){idx=i;track.style.transform=`translateX(-${i*50}%)`;btns.forEach(b=>b.classList.toggle('on',+b.dataset.i===i));theme(i===0?'book':'life');movePill();window.scrollTo({top:0,behavior:'smooth'});}
function movePill(){const on=document.querySelector('.wtab.on');pill.style.left=on.offsetLeft+'px';pill.style.width=on.offsetWidth+'px';}
btns.forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
let x0=null;vp.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
vp.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;if(dx<-55&&idx===0)go(1);else if(dx>55&&idx===1)go(0);x0=null;});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
theme('book');window.addEventListener('load',()=>{movePill();});window.addEventListener('resize',movePill);movePill();
</script>
