<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lola Nomadlife — Media Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  /* base palette */
  --paper:#DCCFC0; --paper2:#FAF5EC; --ink:#241D15; --soft:#6E6253; --line:rgba(36,29,21,.14);
  --accent:#B0613C; --accent-soft:rgba(176,97,60,.10);
  /* panel palette (overridden by theme()) */
  --bg1:#bcd9ec; --bg2:#eaf2f7;
  --pink:#C66E82; --yellow:#EBCAD1;
  --note:#F8EFEA; --card:#ffffff; --tape:rgba(255,255,255,.55);
  /* fonts */
  --serif:'Inter',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --disp:'Inter',var(--sans); --hand:'Inter',system-ui,sans-serif;
  --t:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--ink);background:#1a1410;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-feature-settings:"liga" 1,"kern" 1,"ss01" 1;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
::selection{background:var(--accent);color:#fff}

/* ====== MEDIA KIT VIEW ====== */
#view{
  min-height:100vh;
  padding:22px 18px 60px;
  background:radial-gradient(120% 80% at 80% -10%,rgba(255,255,255,.6),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg2) 60%);
  background-attachment:fixed;
  transition:background .8s var(--t);
}

/* browser window card */
.win{max-width:1080px;margin:0 auto;background:#fff;border-radius:18px;overflow:hidden;
  box-shadow:0 40px 90px -40px rgba(20,30,50,.55),0 4px 0 rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.06)}

/* chrome bar */
.vbar{position:sticky;top:0;z-index:60;background:#f3f1ee;border-bottom:1px solid rgba(29,27,26,.12);
  display:flex;align-items:center;gap:14px;padding:12px 16px}
.lights{display:flex;gap:7px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.vurl{background:#fff;border:1px solid rgba(29,27,26,.12);border-radius:100px;padding:6px 16px;font-size:12.5px;color:#6b6360;font-weight:600;display:flex;align-items:center;gap:7px}
.vurl::before{content:"🔒";font-size:10px}
.vtabs{position:relative;display:flex;gap:4px;background:#e7e4e0;border-radius:100px;padding:4px;margin-left:auto}
.vtab{position:relative;z-index:2;border:none;background:none;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:13px;padding:8px 20px;border-radius:100px;color:#6b6360;transition:color .4s var(--t)}
.vtab.on{color:#fff}
.vtab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vpill{position:absolute;z-index:1;top:4px;bottom:4px;border-radius:100px;background:var(--accent);transition:all .55s var(--t),background .6s var(--t)}
@media(max-width:680px){
  #view{padding:10px 8px 40px}
  .win{border-radius:12px}
  .vbar{gap:8px;padding:10px}
  .lights,.vurl{display:none}
  .vtabs{flex:1;margin-left:0}
  .vtab{flex:1;padding:7px 8px;font-size:11px}
}

/* ====== PANEL CONTENT (v3) ====== */
.pad{padding:0 30px}
@media(max-width:680px){.pad{padding:0 18px}}

.tape{position:absolute;width:74px;height:24px;background:var(--tape);border:1px solid rgba(255,255,255,.5);box-shadow:0 1px 4px rgba(0,0,0,.08);z-index:5}
.star{position:absolute;color:var(--accent);font-size:18px;opacity:.42;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));z-index:4;pointer-events:none}
.clip{position:absolute;font-size:30px;transform:rotate(8deg);z-index:6;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}

/* HERO */
.hero{position:relative;padding:46px 30px 30px}
.bubble{position:absolute;top:30px;right:34px;background:var(--accent);color:#fff;font-weight:800;font-size:12.5px;padding:9px 15px;border-radius:100px;transform:rotate(2deg);z-index:7;box-shadow:0 12px 24px -14px var(--accent)}
.kicker{font-family:var(--sans);font-size:14px;font-weight:700;color:var(--accent);letter-spacing:0;margin-bottom:8px}
.name{font-family:var(--disp);font-size:clamp(52px,9vw,104px);font-weight:800;line-height:.92;letter-spacing:0;position:relative;display:inline}
.name .hl{position:relative;z-index:1;display:inline-block;background:var(--yellow);border-radius:.22em;padding:.02em .16em .06em;line-height:.98;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.script{font-family:var(--sans);font-size:clamp(22px,3.4vw,38px);color:var(--accent);display:block;margin-top:12px;font-weight:650;letter-spacing:0}
.handle{font-size:14px;font-weight:700;color:var(--soft);letter-spacing:0;margin-top:14px}
.hero-row{display:grid;grid-template-columns:1.3fr .7fr;gap:26px;align-items:start;margin-top:26px}
.portrait-wrap{position:relative;max-width:260px;margin:0 auto}
.portrait-wrap .clip{top:-14px;right:-8px}
.note{position:relative;background:var(--note);padding:22px 26px 24px;border:1px solid rgba(36,29,21,.10);border-radius:16px;box-shadow:0 20px 42px -30px rgba(36,29,21,.35);font-size:15.5px;line-height:1.45}
.note .nh{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:0;text-transform:uppercase;margin-bottom:12px;color:var(--accent)}
.note .pin{display:none}
.note p{margin:0 0 10px}
.note p:last-of-type{margin-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font-size:12.5px;font-weight:700;background:#fff;border:1px solid rgba(36,29,21,.14);border-radius:100px;padding:7px 13px;color:var(--ink)}
.polaroid{position:relative;background:#fff;padding:11px 11px 40px;border-radius:4px;box-shadow:0 18px 34px -16px rgba(0,0,0,.4);transform:rotate(3deg);transition:transform .4s var(--t);max-width:85%;margin:0 auto}
.portrait-wrap .polaroid{max-width:100%;padding-bottom:12px}
.polaroid:hover{transform:rotate(0) scale(1.02)}
.polaroid .img{aspect-ratio:4/5;border-radius:2px;background:linear-gradient(150deg,var(--accent),var(--yellow));display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);font-family:var(--sans);font-size:20px;overflow:hidden}
.polaroid .img img{width:100%;height:100%;object-fit:cover;object-position:center top}
.polaroid .cap{font-family:var(--sans);font-size:13px;font-weight:650;text-align:center;margin-top:8px;color:var(--ink)}
.portrait-wrap .polaroid .cap{min-height:74px;display:flex;align-items:center;justify-content:center;margin-top:0;padding:8px 4px 2px;line-height:1.32}
.polaroid .tape{top:-10px;left:50%;margin-left:-37px;transform:rotate(-4deg)}
@media(max-width:680px){.hero-row{grid-template-columns:1fr;gap:20px;margin-top:20px}.portrait-wrap{width:min(220px,68vw);max-width:none}.portrait-wrap .clip{top:-15px;right:-12px;font-size:28px}.polaroid{max-width:200px;margin:0 auto}.portrait-wrap .polaroid{max-width:100%}.bubble{display:none}}

.shead{display:flex;align-items:center;gap:12px;margin:42px 0 20px}
.folder{font-size:26px}
.stitle{font-family:var(--disp);font-size:clamp(24px,4vw,36px);font-weight:720;letter-spacing:0}
.stitle .u{display:inline-block;background:var(--yellow);color:var(--ink);padding:.02em .16em .06em;border-radius:.24em;line-height:1.02;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.stitle .hand{font-family:var(--disp);font-size:1em;color:var(--accent);font-weight:720}

/* AUDIENCE CARDS */
.aud-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.aud-card{background:#fff;border:1px solid rgba(36,29,21,.12);border-radius:18px;box-shadow:0 20px 38px -32px rgba(36,29,21,.36);padding:26px 28px;display:flex;flex-direction:column}
.aud-card h4{font-size:11.5px;font-weight:800;letter-spacing:0;text-transform:uppercase;margin-bottom:8px}
.aud-rows{display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:4px;margin-top:14px}
.aud-row .tp{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;margin-bottom:9px}
.aud-row .tp .pc{font-family:var(--disp);font-size:18px;color:var(--accent);font-weight:700;letter-spacing:0}
.aud-row .bt{height:10px;background:rgba(36,29,21,.08);border-radius:100px;overflow:hidden}
.aud-row .bf{height:100%;width:0;background:var(--accent);border-radius:100px;transition:width 1.1s var(--t)}
.aud-gender{grid-column:1/-1;background:var(--ink);color:#FAF5EC;border-radius:18px;padding:22px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.aud-gender .big{font-family:var(--disp);font-size:clamp(24px,3.5vw,34px);font-weight:650;letter-spacing:0;white-space:nowrap}
.aud-gender .big em{font-style:normal}
.aud-split{display:flex;align-items:center;gap:14px;flex:1;min-width:200px}
.aud-splitbar{flex:1;height:12px;background:rgba(250,245,236,.18);border-radius:100px;overflow:hidden;display:flex}
.aud-splitbar i{display:block;height:100%}
.aud-splitbar .f{background:#E89BB0;width:0;transition:width 1.1s var(--t)}
.aud-legend{font-size:12px;display:flex;gap:16px;font-weight:600;white-space:nowrap;color:#FAF5EC}
.aud-legend span{display:flex;align-items:center;gap:6px}
.aud-legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
@media(max-width:680px){.aud-grid{grid-template-columns:1fr}.aud-gender{flex-direction:column;align-items:flex-start;gap:18px;padding:24px 22px}.aud-gender .big{white-space:normal}.aud-split{width:100%;min-width:0;flex:none}.aud-splitbar{width:100%;flex:0 0 100%}.aud-legend{width:100%;gap:12px;flex-wrap:wrap;white-space:normal}}

/* BIG STAT CARDS */
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.bstat{background:#fff;border:1px solid rgba(36,29,21,.12);border-radius:16px;padding:18px 16px 16px;box-shadow:0 18px 34px -28px rgba(36,29,21,.34);transition:transform .3s var(--t)}
.bstat:hover{transform:translate(-2px,-2px)}
.bstat .bn{font-family:var(--disp);font-size:clamp(30px,3.5vw,42px);line-height:1;font-weight:800;letter-spacing:0}
.bstat .bn em{font-style:normal;color:var(--accent)}
.bstat .bk{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0;margin-top:8px;color:var(--ink)}
.bstat .bs{font-size:11px;color:var(--soft);margin-top:2px}
@media(max-width:680px){.bigstats{grid-template-columns:1fr}.bstat .bn{font-size:26px}}

/* PHONE + STATS SPLIT */
.numbers-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:center;margin:24px 0 8px}
@media(max-width:760px){.numbers-split{grid-template-columns:1fr}}
.phone-showcase{display:flex;justify-content:center}
.stats-shot .polaroid{cursor:pointer;transform:rotate(-2deg);max-width:none;width:min(100%,430px);margin:0 auto}
.stats-shot:nth-child(2) .polaroid{transform:rotate(1.5deg);width:min(100%,390px)}
.stats-shot .polaroid .img{aspect-ratio:auto;height:auto}
.stats-shot .polaroid .img img{object-fit:contain;height:auto}
.stats-aside{display:grid;grid-template-columns:1fr;gap:9px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border:1px solid rgba(36,29,21,.12);border-radius:12px;box-shadow:0 14px 28px -25px rgba(36,29,21,.34);transition:transform .3s var(--t)}
.srow:hover{transform:translate(-2px,-2px)}
.srow .sv{font-family:var(--disp);font-size:20px;font-weight:800;letter-spacing:0;color:var(--accent);white-space:nowrap;min-width:66px}
.srow .sl{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
.srow .sl span{display:block;font-size:11px;font-weight:500;color:var(--soft);margin-top:1px}
.substrip{margin-top:20px;background:var(--ink);color:#fff;border-radius:100px;padding:11px 20px;font-size:12.5px;font-weight:700;text-align:center;letter-spacing:0}
@media(max-width:680px){.substrip{font-size:11px;border-radius:18px}}

/* VIDEOS */
.vids{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.vid{position:relative;background:#fff;padding:10px 10px 34px;border:0;border-radius:4px;box-shadow:0 16px 30px -16px rgba(0,0,0,.4);text-decoration:none;color:inherit;transform:rotate(var(--r,0deg));transition:transform .4s var(--t);display:block;width:100%;cursor:pointer;font-family:inherit;text-align:inherit}
.vid:hover{transform:rotate(0) translateY(-5px)}
.vid:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.vid:nth-child(3n+1){--r:-1.5deg}.vid:nth-child(3n+2){--r:1.5deg}.vid:nth-child(3n){--r:-.6deg}
.vid .thumb{aspect-ratio:9/16;border-radius:2px;overflow:hidden;background:linear-gradient(160deg,var(--accent),var(--yellow));position:relative}
.vid .thumb img{width:100%;height:100%;object-fit:cover}
.vid.todo .thumb{background:repeating-linear-gradient(45deg,#f1eee9,#f1eee9 12px,#e7e3dc 12px,#e7e3dc 24px);display:flex;align-items:center;justify-content:center}
.vid.todo .thumb .add{color:var(--soft);font-family:var(--sans);font-size:15px;font-weight:650;text-align:center;padding:14px}
.vid .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.vid .pinb{position:absolute;top:8px;left:8px;z-index:2;background:var(--accent);color:#fff;font-size:10px;font-weight:800;padding:3px 9px;border-radius:100px}
.vid .cap{font-family:var(--sans);font-size:14.5px;font-weight:650;text-align:center;margin-top:11px;line-height:1.22;padding:0 4px}
@media(max-width:680px){.vids{grid-template-columns:1fr 1fr;gap:10px}}

/* TESTIMONIALS */
.testis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.testi{background:#fff;border:1px solid rgba(36,29,21,.12);border-radius:16px 16px 16px 4px;box-shadow:0 16px 30px -26px rgba(36,29,21,.34);padding:17px 18px;font-size:13.5px;line-height:1.5}
.testi .who{font-family:var(--sans);font-size:13px;font-weight:750;color:var(--accent);margin-top:9px}
.testis.marquee{display:block;overflow:hidden;margin:6px -30px 0;padding:4px 0 18px;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marquee-track{--gap:14px;display:flex;gap:var(--gap);width:max-content;animation:testi-marquee 52s linear infinite;will-change:transform}
.testis.marquee:hover .marquee-track{animation-play-state:paused}
.testi.img-card{flex:0 0 clamp(260px,42vw,440px);padding:8px;border-radius:14px;background:#fff}
.testi.img-card img{display:block;width:100%;height:auto;border-radius:10px}
@keyframes testi-marquee{from{transform:translateX(0)}to{transform:translateX(calc(-50% - var(--gap)/2))}}
@media(prefers-reduced-motion:reduce){.testis.marquee{overflow-x:auto;mask-image:none}.marquee-track{animation:none}}
@media(max-width:760px){.testis{grid-template-columns:1fr}}
@media(max-width:680px){.testis.marquee{margin-left:-18px;margin-right:-18px}.testi.img-card{flex-basis:68vw}}

/* RATES */
.ratecard{background:#fff;border:1px solid rgba(36,29,21,.14);border-radius:18px;box-shadow:0 22px 42px -32px rgba(36,29,21,.4);padding:24px 26px;position:relative}
.rategrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ratecard .tagp{position:absolute;top:-12px;right:22px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:5px 13px;border-radius:100px;transform:rotate(3deg)}
.rate-incl{font-size:13px;color:var(--soft);border-bottom:2px dashed rgba(29,27,26,.12);padding-bottom:15px;margin-bottom:6px}
.rate-incl b{color:var(--ink);font-weight:800}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-bottom:1px solid rgba(29,27,26,.12)}
.rrow:last-child{border-bottom:none}
.rrow.feat{background:var(--note);margin:6px -16px 0;padding:16px;border-radius:14px;border-bottom:none}
.rrow .rl .rn{font-family:var(--sans);font-size:16px;font-weight:800}
.rrow .rl .rd{font-size:12.5px;color:var(--soft);margin-top:3px;max-width:430px}
.rrow .rpr{font-family:var(--disp);font-size:28px;font-weight:800;letter-spacing:0;color:var(--accent);white-space:nowrap}
@media(max-width:820px){.rategrid{grid-template-columns:1fr}}
@media(max-width:680px){.ratecard{padding:22px 18px}.rrow{gap:12px}.rrow .rl .rn{font-size:14px}.rrow .rpr{font-size:22px}}

/* CONTACT */
.contact{margin-top:46px;text-align:center;position:relative;padding:30px 0 8px}
.contact .ch{font-family:var(--disp);font-size:clamp(32px,5vw,52px);font-weight:720;letter-spacing:0;line-height:1;margin-bottom:22px}
.contact .ch .u{display:inline-block;background:var(--yellow);padding:.02em .16em .06em;border-radius:.24em;line-height:1.02;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.contact .cs{font-family:var(--sans);font-size:16px;font-weight:650;color:var(--accent);margin:-12px 0 22px}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;font-size:15px;padding:15px 34px;border-radius:100px;box-shadow:0 16px 30px -18px var(--accent);transition:transform .3s var(--t),background .3s var(--t)}
.btn:hover{background:var(--accent)}
.btn:hover{transform:translateY(-2px)}

/* DOCK */
.dock{display:flex;justify-content:center;gap:10px;background:rgba(255,255,255,.7);backdrop-filter:blur(14px);border-top:1px solid rgba(29,27,26,.12);padding:10px 10px 16px;margin-top:8px;position:sticky;bottom:0;z-index:60}
.dock a{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.25);transition:transform .3s var(--t);text-decoration:none}
.dock a:hover{transform:translateY(-6px) scale(1.08)}

/* MODAL */
.ssmodal{display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.88);align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.ssmodal.open{display:flex}
.ssmodal img{max-height:90vh;max-width:90vw;border-radius:28px;box-shadow:0 40px 100px rgba(0,0,0,.6)}
.ssmodal-close{position:absolute;top:20px;right:24px;color:rgba(255,255,255,.7);font-size:38px;cursor:pointer;background:none;border:none;line-height:1;transition:color .2s,transform .2s}
.ssmodal-close:hover{color:#fff;transform:scale(1.1)}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .8s var(--t),transform .8s var(--t)}
.reveal.in{opacity:1;transform:none}
</style>
</head>
<body>

<!-- MODAL (image lightbox) -->
<div class="ssmodal" id="ssModal" onclick="closeModal()">
  <button class="ssmodal-close" onclick="closeModal()" aria-label="Fermer">×</button>
  <img src="" alt="Screenshot stats" onclick="event.stopPropagation()">
</div>

<!-- MEDIA KIT -->
<section id="view">
  <div class="win">
    <div class="vbar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="vurl">www.lolanomadlife.com</div>
      <nav class="vtabs" id="vtabs">
        <span class="vpill" id="vpill"></span>
        <button type="button" class="vtab" data-go="book">📚 BookTalk</button>
        <button type="button" class="vtab" data-go="life" hidden>🌴 LifeStyle</button>
      </nav>
    </div>
    <div id="vcontent"></div>
    <nav class="dock" id="dock"></nav>
  </div>
</section>

<script>
const REAL={
  contactEmail:"collabs.lola@gmail.com",
  socials:[
    {emoji:"🎵",url:"https://www.tiktok.com/@lola_nomad_life",t:"TikTok"},
    {emoji:"📸",url:"https://www.instagram.com/lola_nomadlife",t:"Instagram"},
    {emoji:"🧵",url:"https://www.threads.net/@lola_nomadlife",t:"Threads"},
    {emoji:"🛍️",url:"https://lolanomadlife.com/shop",t:"Shop"},

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function vidHTML(v){
  if(v.todo) return `<div class="vid todo"><div class="thumb"><span class="add">+ ajoute le lien<br>& les vues</span></div><div class="cap">${v.t}</div></div>`;
  const thumb=`<div class="thumb">${v.pinned?'<span class="pinb">📌</span>':''}${v.img?`<img src="${v.img}" alt="${esc(v.t)}" loading="lazy">`:''}</div><div class="cap">${v.t}</div>`;
  if(v.url && v.url !== "#") return `<a class="vid" href="${v.url}" target="_blank" rel="noopener">${thumb}</a>`;
  return `<button class="vid" type="button" onclick="openModal('${v.img}')" aria-label="Voir ${esc(v.t)} en grand">${thumb}</button>`;
}

}

/* ── Navigation ─────────────────────────────── */
const view=document.getElementById('view');
const vc=document.getElementById('vcontent');
const vpill=document.getElementById('vpill');
const vtabs=document.querySelectorAll('.vtab');

function theme(k){
  const t=THEMES[k]||THEMES.book;
  const r=document.documentElement.style;
  for(const key in t) r.setProperty('--'+key,t[key]);
}

function movePill(){
  const on=document.querySelector('.vtab.on');
  if(!on) return;
  vpill.style.left=on.offsetLeft+'px';
  vpill.style.width=on.offsetWidth+'px';
}

function initReveal(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){
      e.target.classList.add('in');
      e.target.querySelectorAll('.bf').forEach(f=>f.style.width=f.dataset.w+'%');
      e.target.querySelectorAll('.aud-splitbar .f').forEach(f=>f.style.width=f.dataset.w+'%');
    }
  }),{threshold:.2});
  document.querySelectorAll('#vcontent .reveal').forEach(el=>io.observe(el));
}

function openView(key){
  theme(key);
  vc.innerHTML=panel(TABS[key]);
  vtabs.forEach(b=>{
    const on=b.dataset.go===key;
    b.classList.toggle('on',on);
    b.toggleAttribute('aria-current',on);
  });
  window.scrollTo(0,0);
  movePill();
  setTimeout(initReveal,120);
}

vtabs.forEach(b=>b.addEventListener('click',()=>openView(b.dataset.go)));
openView('book');


/* ── Dock & Modal ────────────────────────────── */
document.getElementById('dock').remove();

function openModal(src){
  const m=document.getElementById('ssModal');
  m.querySelector('img').src=src;
  m.classList.add('open');
}
function closeModal(){document.getElementById('ssModal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.getAttribute('role')==='button')e.target.click();});

window.addEventListener('resize',movePill);
